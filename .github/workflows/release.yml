name: Compilar y publicar colección
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: python scripts/distribution.py check
      - run: pnpm test
      - run: python scripts/third_party.py
      - run: pnpm build:web
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/fixtures.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Verificar y empaquetar web
        run: python scripts/packages.py web
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: dist/web/
      - uses: actions/upload-artifact@v4
        with:
          name: final-web
          path: |
            dist/Marco-Editor-Web.zip
            dist/Marco-Editor-Terceros-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: test-output/browser-report.json
  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: dist/web
      - run: pnpm test
      - run: python -m pip install imageio-ffmpeg
      - run: python scripts/fixtures.py
      - name: Dependencias gráficas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      - run: pnpm build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exportación en Windows empaquetado
        if: runner.os == 'Windows'
        run: node tests/desktop.cjs 'dist/desktop/win-unpacked/Marco Editor.exe'
      - name: Exportación en Linux empaquetado
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/desktop.cjs dist/desktop/linux-unpacked/marco-editor
      - name: Portable y Web Portable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'test-output/portable-report.json'
          $process = Start-Process -FilePath (Resolve-Path 'dist/desktop/Marco-Editor-Portable.exe') -ArgumentList '--smoke',$report -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Fallo del portable' }
          if (!(Get-Content $report | ConvertFrom-Json).ready) { throw 'El portable no abrió la interfaz' }
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --onefile --windowed --name Marco-Editor-Web-Portable --add-data 'dist/web;dist/web' scripts/portable_web.py
          python scripts/check_portable.py dist/Marco-Editor-Web-Portable.exe
          Copy-Item dist/Marco-Editor-Web-Portable.exe dist/desktop/
      - name: Comprobar los paquetes de sistema
        run: python scripts/packages.py desktop
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ runner.os }}
          path: |
            dist/desktop/Marco-Editor-*.exe
            dist/desktop/Marco-Editor-*.deb
            dist/desktop/Marco-Editor-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-report-${{ runner.os }}
          path: test-output/*report.json
  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: dist/web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar y verificar APK firmado
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pnpm exec cap sync android
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/marco-editor.p12
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist/Marco-Editor-Android.apk
      - run: python scripts/packages.py android
      - uses: actions/upload-artifact@v4
        with:
          name: final-android
          path: dist/Marco-Editor-Android.apk
  publish:
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-*
          path: artifacts
          merge-multiple: true
      - run: python scripts/distribution.py finalize artifacts
      - name: Publicar conjunto completo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("project.json"))["version"])')"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then echo 'Etiqueta y versión no coinciden'; exit 1; fi
          gh release create "$tag" artifacts/* --draft --target "$GITHUB_SHA" --title "Marco Editor $version" --notes-file "docs/releases/$tag.md"
          gh release edit "$tag" --draft=false --latest
